site_name: 提瓦特新世界
site_description: 基于《原神》世界观的系统性二次创作与深度世界构建项目
site_url: https://the-new-world-of-teyvat.bstinspection.com/
repo_url: https://github.com/AFewMoon/the-New-World-of-Teyvat
repo_name: AFewMoon/the-New-World-of-Teyvat
edit_uri: edit/master/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

docs_dir: content

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

