  <title id="t">至冬国国徽</title>
  <desc id="d">盾徽：盾顶一簇五枚冰晶合成的冰晶冠，盾边深蓝，环带冰白刻冰裂纹；盾心深蓝，两株通体雪白的白桦自盾底相对弯起，在盾心上方合成白桦拱，金焰自拱口穿出，火炬立在盾底。</desc>
