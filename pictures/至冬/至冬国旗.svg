  <title id="t">至冬国国旗</title>
  <desc id="d">冰白旗面，底部一道深蓝横带，带上压一道冰蓝冰线；旗心一枚完整的冰蓝六面巨晶，晶中立着一支金色火炬，焰尖收在晶顶之内，炬柄向下没入晶底，火种封在冰中。</desc>
