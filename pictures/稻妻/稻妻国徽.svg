  <title id="t">稻妻王国国徽</title>
  <desc id="d">家纹式圆徽：金色外环内为深紫雷纹带与雷紫圆章，章心一枚金色三巴纹；圆徽之上承三峰神樱冠，深紫冠体镶金边，冠内三朵五瓣神樱，樱瓣月白、花心为金。</desc>
