<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="300" height="300" role="img" aria-labelledby="t d">
  <title id="t">海祇岛自治领徽</title>
  <desc id="d">盾徽：粉红盾框内为海蓝盾面，盾底为潮白青海波叠浪；盾心一道潮白浪纹环，环内海蓝盾面上嵌一颗实心潮白珍珠，其下生一枝粉红珊瑚，四条分枝向上弯曲，枝端各生潮白球节。</desc>
