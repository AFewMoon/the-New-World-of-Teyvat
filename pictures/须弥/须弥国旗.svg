<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 2000" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">须弥社会主义联邦国旗</title>
  <desc id="d">旗面以中线左右对分：左半革命红，象革命与人民；右半沙金，象沙漠。中央一株月白生命树，树冠为七片尖叶自冠座对称层叠的冠形，冠内缀三枚沙金智慧果实；树干自立 Y 形分叉托住树冠，象征雨林与沙漠共同滋养的联邦。</desc>
  <g transform="scale(5)">
