  <title id="t">须弥社会主义联邦国徽</title>
  <desc id="d">盾徽：沙金盾边，深褐环带内缀沙金叶纹；月白盾心，主纹章为一株绯红生命树，树冠由五片尖叶对称层叠成扇状，冠内缀三枚沙金智慧果实，树干作 Y 形分叉；树下左垂双穗麦束、右立九齿齿轮，一为劳动党、一为科学联盟，共同拱卫树身。</desc>
