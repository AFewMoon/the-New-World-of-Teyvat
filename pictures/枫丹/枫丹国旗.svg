<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 2000" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">枫丹重建共和国国旗</title>
  <desc id="d">雪白旗面，中部一道水蓝横带，上下各镶一道深蓝细线；横带中央为金色天平：横梁中部有圆轴，两端各垂三段短链与碗形托盘；横梁正中垂下一柄长剑，有十字形剑格、上宽下收的剑身与尖锋——被天平衡量过的剑。</desc>
