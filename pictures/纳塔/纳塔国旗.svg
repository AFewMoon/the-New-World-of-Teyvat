  <title id="t">纳塔联盟国旗</title>
  <desc id="d">深褐旗面，中央一团高耸的金色圣火燃于圣火坛上，火心为火红；圣火背后放射六道金色光芒，每 60 度一道、严格等分，象征回声之子、流泉之众、悬木人、花羽会、沃陆之邦、烟谜主六个共和国。</desc>
