  <title id="t">纳塔联盟国徽</title>
  <desc id="d">圆形金环徽：外环金边内为火红环带，环带上等距排列十八枚深褐火纹；环带以金线为界，内场深褐，中央燃一团金色圣火，圣火四周以六角等半径排列六枚金环，象征六个共和国。</desc>
