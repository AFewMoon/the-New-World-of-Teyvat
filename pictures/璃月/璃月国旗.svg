<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 2000" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">璃月共和国国旗</title>
  <desc id="d">旗面以中线左右纵分：左半米白，象契约之纸与留白；右半琥珀金，象岩与摩拉。顶部一道粉红窄边带横贯旗面，象岩层上的桃花与琉璃色。中线处跨分割线立一枚墨色六棱岩晶，晶内套赭石六棱矿脉，再套粉红六棱矿心，自外而内为「岩、脉、心」三层。</desc>
  <g transform="scale(5)">
