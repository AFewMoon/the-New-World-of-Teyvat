    <rect x="300" width="300" height="2000" fill="#E0A94A" y="0" />
    <rect width="600" height="36" fill="#E79AA6" y="0" x="0" />
    <polygon points="300,114 390.1,166 390.1,270 300,322 209.9,270 209.9,166" fill="#2B2118" />
    <polygon points="300,156 353.7,187 353.7,249 300,280 246.3,249 246.3,187" fill="#8A5A2B" />
    <polygon points="300,192 322.5,205 322.5,231 300,244 277.5,231 277.5,205" fill="#E79AA6" />
