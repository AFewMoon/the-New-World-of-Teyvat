  <!-- 地图标题注 -->
  <text x="2180" y="1466" text-anchor="end" font-size="13" fill="#6B5A40">布局为示意：五国方向以线路与标注为准；三大国际交换中心呈「三角布局」。</text>

  <!-- ═══════════ 对比表 ═══════════ -->
  <text x="1200" y="1560" text-anchor="middle" font-size="20" font-weight="700" fill="#3B2F23">三大国际交换中心对比</text>
  <g>
    <rect x="60" y="1580" width="2280" height="44" fill="#3B2F23"/>
    <text x="480" y="1609" text-anchor="middle" font-size="14" font-weight="700" fill="#D8AF45">维度</text>
    <text x="1120" y="1609" text-anchor="middle" font-size="14" font-weight="700" fill="#D8AF45">璃港府国际交换中心（南线枢纽）</text>
    <text x="1680" y="1609" text-anchor="middle" font-size="14" font-weight="700" fill="#D8AF45">珑埠府国际交换中心（北线枢纽）</text>
    <text x="2120" y="1609" text-anchor="middle" font-size="14" font-weight="700" fill="#D8AF45">翠玦府国际交换中心</text>
    <!-- 行1 -->
    <rect x="60" y="1624" width="2280" height="52" fill="#F5EFE0"/>
    <text x="84" y="1656" font-size="13" font-weight="700" fill="#B8922F">对外总带宽</text>
    <text x="1120" y="1656" text-anchor="middle" font-size="13" fill="#3B2F23">3 TB/s</text>
    <text x="1680" y="1656" text-anchor="middle" font-size="13" fill="#3B2F23">3 TB/s</text>
    <text x="2120" y="1656" text-anchor="middle" font-size="13" fill="#3B2F23">2 TB/s（弹性扩展至 3 TB/s）</text>
    <!-- 行2 -->
    <rect x="60" y="1676" width="2280" height="76" fill="#FBF8F2"/>
    <text x="84" y="1708" font-size="13" font-weight="700" fill="#B8922F">主要方向</text>
    <text x="1120" y="1708" text-anchor="middle" font-size="13" fill="#3B2F23">稻妻（海底光缆·主干网）</text>
    <text x="1120" y="1732" text-anchor="middle" font-size="13" fill="#3B2F23">须弥（专线）、蒙德（专线经归离原）</text>
    <text x="1680" y="1708" text-anchor="middle" font-size="13" fill="#3B2F23">枫丹（专线）、至冬（主干网）、</text>
    <text x="1680" y="1732" text-anchor="middle" font-size="13" fill="#3B2F23">须弥与蒙德（专线备份）</text>
    <text x="2120" y="1720" text-anchor="middle" font-size="13" fill="#3B2F23">所有方向的低成本路由</text>
    <!-- 行3 -->
    <rect x="60" y="1752" width="2280" height="52" fill="#F5EFE0"/>
    <text x="84" y="1784" font-size="13" font-weight="700" fill="#B8922F">路由路径</text>
    <text x="1120" y="1784" text-anchor="middle" font-size="13" fill="#3B2F23">低延迟走专用直连，普通流走主干网</text>
    <text x="1680" y="1784" text-anchor="middle" font-size="13" fill="#3B2F23">低延迟走专用直连，普通流走主干网</text>
    <text x="2120" y="1784" text-anchor="middle" font-size="13" fill="#3B2F23">全部走主干网共享带宽</text>
    <!-- 行4 -->
    <rect x="60" y="1804" width="2280" height="52" fill="#FBF8F2"/>
    <text x="84" y="1836" font-size="13" font-weight="700" fill="#B8922F">成本 / 延迟定位</text>
    <text x="1120" y="1836" text-anchor="middle" font-size="13" fill="#3B2F23">标准成本 · 低延迟（≤ 15 ms 至须弥）</text>
    <text x="1680" y="1836" text-anchor="middle" font-size="13" fill="#3B2F23">标准成本 · 低延迟（≤ 50 ms 至枫丹）</text>
    <text x="2120" y="1836" text-anchor="middle" font-size="13" fill="#3B2F23">低成本（约 60~70%）· 一般延迟</text>
    <!-- 行5 -->
    <rect x="60" y="1856" width="2280" height="52" fill="#F5EFE0"/>
    <text x="84" y="1888" font-size="13" font-weight="700" fill="#B8922F">特殊功能</text>
    <text x="1120" y="1888" text-anchor="middle" font-size="13" fill="#3B2F23">国家网关（南向）· 海底光缆登陆站</text>
    <text x="1680" y="1888" text-anchor="middle" font-size="13" fill="#3B2F23">国家网关（北向）· 北方极地路由中继</text>
    <text x="2120" y="1888" text-anchor="middle" font-size="13" fill="#3B2F23">国家网关（低成本路由）· ITS 与拥塞绕行</text>
    <rect x="60" y="1580" width="2280" height="328" fill="none" stroke="#C9A227" stroke-width="2"/>
