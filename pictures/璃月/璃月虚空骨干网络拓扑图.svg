    <rect x="682" y="747" width="196" height="46" rx="6" fill="#FBF8F2" stroke="#D8CCAE" stroke-width="1"/>
    <text x="780" y="767" text-anchor="middle" fill="#B8922F" font-weight="700">500 km · 2.5 TB/s</text>
    <text x="780" y="786" text-anchor="middle">沿快速铁路线</text>
  </g>

