  <!-- ═══════════ 底部左 · 骨架与铁路协同 ═══════════ -->
  <g>
    <rect x="60" y="1950" width="1130" height="440" rx="12" fill="#3B2F23" stroke="#C9A227" stroke-width="2"/>
    <text x="84" y="1990" font-size="19" font-weight="700" fill="#F7EBC8">「双环三角」骨架与铁路协同</text>
    <text x="84" y="2024" font-size="13" fill="#E8D8AC">五大府间骨干环路＋三大国际交换节点构成「双环三角」；任意单点光缆中断均可经反向路径绕行，不影响全网连通。</text>
    <rect x="84" y="2044" width="1082" height="316" rx="10" fill="#4A3A28" stroke="#C9A227" stroke-width="1.2"/>
    <text x="108" y="2078" font-size="14" font-weight="700" fill="#D8AF45">与 LRC 列车通信网络「共用渠道、物理分离」的四项优势</text>
    <text x="108" y="2110" font-size="13" fill="#F3EDDE">· 安全隔离：同一沟槽／杆塔／隧道内各自独立光纤束，无电磁串扰，LTCS 信号安全等级不受影响</text>
    <text x="108" y="2140" font-size="13" fill="#F3EDDE">· 冗余互补：一方受损时可借对方备用纤芯应急恢复（光缆交接箱手动跳接），日常完全独立</text>
    <text x="108" y="2170" font-size="13" fill="#F3EDDE">· 成本分摊：沟槽开挖、管道预埋、杆塔架设等土建费用由铁路总公司与鱼灯通讯按比例分摊</text>
    <text x="108" y="2200" font-size="13" fill="#F3EDDE">· 维护协同：滑坡、洪水等灾害发生时两方维护队伍联合出动、同步抢修，提高恢复效率</text>
    <text x="108" y="2240" font-size="13" font-weight="700" fill="#D8AF45">建设方式</text>
    <text x="108" y="2268" font-size="13" fill="#F3EDDE">利用铁路路基、桥梁、隧道等既有基础设施敷设，大幅降低建设成本与施工周期；</text>
    <text x="108" y="2294" font-size="13" fill="#F3EDDE">物理层三种介质（光缆、地脉、飞艇微波）在网络层实现透明切换，用户无需感知链路差异。</text>
    <text x="108" y="2334" font-size="12" fill="#C9B98A">APS（TAA 协议栈）统一编址与路由 · 鱼灯通讯骨干网交换机执行数据包转发</text>
  </g>

  <!-- ═══════════ 底部右 · 路由策略 ═══════════ -->
  <g>
    <rect x="1230" y="1950" width="1110" height="440" rx="12" fill="#F5EFE0" stroke="#C9A227" stroke-width="1.5"/>
    <text x="1254" y="1990" font-size="19" font-weight="700" fill="#3B2F23">国际路由策略两分法</text>
    <rect x="1254" y="2012" width="524" height="350" rx="10" fill="#FBF8F2" stroke="#B8922F" stroke-width="1.5"/>
    <text x="1278" y="2046" font-size="15" font-weight="700" fill="#B8922F">低延迟通道</text>
    <text x="1278" y="2076" font-size="13" fill="#3B2F23">· 专用直连光缆（非主干网）</text>
    <text x="1278" y="2102" font-size="13" fill="#3B2F23">· 路由最优化、跳数最少、不共享带宽</text>
    <text x="1278" y="2128" font-size="13" fill="#3B2F23">· 适用：金融交易、实时音视频、在线游戏</text>
    <text x="1278" y="2154" font-size="13" fill="#3B2F23">· 代价：成本较高、带宽资源有限</text>
    <text x="1278" y="2190" font-size="12" fill="#6B5A40">典型：璃港⇌须弥金融云计算专线、</text>
    <text x="1278" y="2214" font-size="12" fill="#6B5A40">蒙德风能数据中心协同通道、枫丹影视渲染</text>
    <rect x="1802" y="2012" width="514" height="350" rx="10" fill="#FBF8F2" stroke="#C9A227" stroke-width="1.5"/>
    <text x="1826" y="2046" font-size="15" font-weight="700" fill="#B8922F">低成本通道</text>
    <text x="1826" y="2076" font-size="13" fill="#3B2F23">· 主干网共享带宽（容量大、分摊成本低）</text>
    <text x="1826" y="2102" font-size="13" fill="#3B2F23">· 适用：数据备份、批量同步、内容分发</text>
    <text x="1826" y="2128" font-size="13" fill="#3B2F23">· 由翠玦府枢纽统一承接</text>
    <text x="1826" y="2154" font-size="13" fill="#3B2F23">· ITS 自动识别流量类型并引导转发</text>
    <text x="1826" y="2190" font-size="12" fill="#6B5A40">拥塞策略：可为高级用户临时借用专线空闲</text>
    <text x="1826" y="2214" font-size="12" fill="#6B5A40">带宽；专线拥堵时将非实时流强占主干网传输</text>
    <text x="1254" y="2384" font-size="12" fill="#6B5A40">国家网关（LNG）：三中心均承担出入境数据流量管理与安全审查职能。</text>
  </g>

