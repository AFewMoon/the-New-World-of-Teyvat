  <rect width="2400" height="2460" fill="#FBF8F2"/>

  <!-- ═══════════ 标题区 ═══════════ -->
  <text x="1200" y="58" text-anchor="middle" font-size="40" font-weight="700" fill="#3B2F23">璃月虚空骨干网络拓扑图</text>
  <text x="1200" y="96" text-anchor="middle" font-size="15" fill="#6B5A40">「双环三角」骨架 · 沿铁路干线光缆 · 三大国际交换中心与五国方向路由（TAA 一级枢纽）</text>
