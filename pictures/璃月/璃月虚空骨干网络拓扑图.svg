    <text x="935" y="976" text-anchor="middle">沿普快铁路线</text>
    <rect x="857" y="529" width="196" height="46" rx="6" fill="#FBF8F2" stroke="#D8CCAE" stroke-width="1"/>
    <text x="955" y="549" text-anchor="middle" fill="#B8922F" font-weight="700">1000 km · 2.5 TB/s</text>
