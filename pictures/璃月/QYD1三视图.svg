      <circle r="21" fill="#4A4642"/>
      <circle r="14" fill="#3E3A34" stroke="#241B12" stroke-width="2"/>
      <circle r="8" fill="#211E1B"/>
      <circle cx="0" cy="-13" r="3.2" fill="#6E6963"/>
      <circle cx="12" cy="7" r="3.2" fill="#6E6963"/>
      <circle cx="-12" cy="7" r="3.2" fill="#6E6963"/>
