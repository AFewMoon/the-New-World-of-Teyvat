  <!-- ═══════════ 参数表 ═══════════ -->
  <g>
    <rect x="90" y="985" width="1420" height="128" rx="10" fill="#F3EDDE" stroke="#C9A227" stroke-width="2"/>
    <g font-size="15" fill="#3B2F23">
      <text x="130" y="1022" font-weight="700">型号</text><text x="205" y="1022">QYD 1（千岩·电力）</text>
      <text x="470" y="1022" font-weight="700">轴式</text><text x="530" y="1022">Bo-Bo</text>
      <text x="700" y="1022" font-weight="700">轨距</text><text x="760" y="1022">1500 mm</text>
