  <rect width="1600" height="1150" fill="#FBF8F2"/>

  <text x="800" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#145238">QYN 3 型环保混动客运机车</text>
  <text x="800" y="92" text-anchor="middle" font-size="17" fill="#6B8A72">千岩·新能源系列 · 璃月机车集团　|　-C 版「琉璃金 × 翡翠绿」双拼涂装 · Y 字头旅游列车 · 风景区纯岩动力运行</text>
