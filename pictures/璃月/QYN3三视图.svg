    <g font-size="15" fill="#1F3D2C">
      <text x="95" y="1022" font-weight="700">型号</text><text x="170" y="1022">QYN 3（千岩·新能源）</text>
      <text x="460" y="1022" font-weight="700">轴式</text><text x="520" y="1022">Co-Co</text>
