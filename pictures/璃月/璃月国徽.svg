<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="300" height="300" role="img" aria-labelledby="t d">
  <title id="t">璃月共和国国徽</title>
  <desc id="d">圆形徽章：外沿琥珀金圈，墨色环带内以琥珀金织出连续回折纹；内盘米白，中央一枚六棱岩晶，外沿墨色晶边，晶面为琥珀金，内套赭石六棱与墨色岩核。徽心与回折环合观，即「岩晶纹」。</desc>
