    <text x="1790" y="1852" text-anchor="middle" font-size="12" fill="#E8D8AC">武装力量不直接隶属于政务院</text>
    <path d="M 1522 1868 V 1896 M 2058 1868 V 1896" stroke="#B8922F" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1264" y="1902" width="516" height="92" rx="10" fill="#3B2F23" stroke="#C9A227" stroke-width="1.5"/>
    <text x="1522" y="1936" text-anchor="middle" font-size="15" font-weight="700" fill="#F7EBC8">璃月宪兵部队</text>
    <text x="1522" y="1966" text-anchor="middle" font-size="12" fill="#E8D8AC">原千岩军整编 · 对内维稳、反恐</text>
    <rect x="1800" y="1902" width="516" height="92" rx="10" fill="#3B2F23" stroke="#C9A227" stroke-width="1.5"/>
    <text x="2058" y="1936" text-anchor="middle" font-size="15" font-weight="700" fill="#F7EBC8">璃月人民军</text>
    <text x="2058" y="1966" text-anchor="middle" font-size="12" fill="#E8D8AC">对外防御、海防</text>
    <text x="1264" y="2040" font-size="13" font-weight="700" fill="#D8AF45">军委体系内的名誉与外聘岗位</text>
    <text x="1264" y="2070" font-size="13" fill="#F3EDDE">· 北斗：海防动员局局长兼任中央军委委员，军委层面协调海防事务</text>
    <text x="1264" y="2100" font-size="13" fill="#F3EDDE">· 魈：退役夜叉，受聘中央警卫局名誉顾问（不驻会），特种作战与高危目标防护战术指导</text>
    <text x="1264" y="2130" font-size="13" fill="#F3EDDE">· 申鹤：驱魔世家传人，受聘中央特殊事务局外聘专员，协助处理仙家遗物与古籍封印任务</text>
    <rect x="1264" y="2152" width="1052" height="118" rx="10" fill="#4A3A28" stroke="#C9A227" stroke-width="1.2"/>
    <text x="1288" y="2184" font-size="13" font-weight="700" fill="#D8AF45">国防部＝「政务窗口」与「军地协调机制」（不负责前线指挥）</text>
    <text x="1288" y="2212" font-size="12" fill="#E8D8AC">国防预算申请与划拨 · 军工生产协调（如向机车集团采购 QYN 5 混动牵引车作后勤装备）</text>
    <text x="1288" y="2240" font-size="12" fill="#E8D8AC">兵役征集 · 军民技术相互转化 · 与枫丹、蒙德等国例行军事外交与联合演习</text>
    <text x="1790" y="2310" text-anchor="middle" font-size="12" fill="#C9B98A">宪兵对内、人民军对外——分工明确、互不隶属，共同构成党领导下的武装力量体系。</text>
