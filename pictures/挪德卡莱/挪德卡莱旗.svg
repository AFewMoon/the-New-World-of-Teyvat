  <title id="t">挪德卡莱联合政府旗</title>
  <desc id="d">夜蓝旗面，中央三枚白色月相：左为弯月，中为满月（外罩银环），右为残月，两侧弯月朝向对称；下方一座银色灯塔立于旗底之上，三束淡蓝光束自灯塔向上升起，止于月相下缘。</desc>
